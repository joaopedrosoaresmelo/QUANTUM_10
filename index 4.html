<script>
const $=id=>document.getElementById(id),KEY='quantum_v1';
const def=()=>({k:0,e:100,i:100,w:1,done:{},perf:{},inv:[],own:['c1','k1'],eq:'k1',cdx:{},cards:{},ach:{},used:{},sims:{},hint:0,errs:0,mus:.4,sfx:.7,t:0});
let S=def(),cur='title',AC,dg,NB,LT='dil',TH=1;
const ld=()=>{try{const r=localStorage.getItem(KEY);if(!r)return null;const o=Object.assign(def(),JSON.parse(r));if(!o.own.includes('k1'))o.own.push('k1');return o}catch(e){return null}};
const sv=()=>{if(!S.started)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
/* ===== ÁUDIO ===== */
function au(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();dg=AC.createGain();dg.connect(AC.destination);vol();ensureFX();startMusic()}catch(e){}}
const vol=()=>{if(dg)dg.gain.value=S.mus*.45};
function sfx(f,d=.15,t='sine'){if(!AC||S.sfx<.01)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(S.sfx*.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}
function noiseBuf(){if(NB||!AC)return NB;NB=AC.createBuffer(1,Math.floor(AC.sampleRate*.12),AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*.15));return NB}
/* passo: ruído filtrado curto; metal no Mundo 1 e piso macio no Mundo 2 */
function step(){if(!AC||S.sfx<.01)return;const b=noiseBuf();if(!b)return;const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=TH==2?520:1500;f.Q.value=TH==2?1.2:2.5;g.gain.value=S.sfx*(TH==2?.18:.22);s.connect(f);f.connect(g);g.connect(AC.destination);s.start();s.stop(AC.currentTime+.12)}
/* efeitos: reverb compartilhado (convolução com ruído decaindo) */
let REV,RG,MT=0,MI=0,MTimer=null;
function ensureFX(){if(REV||!AC)return;REV=AC.createConvolver();const n=Math.floor(AC.sampleRate*1.6),b=AC.createBuffer(2,n,AC.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3)}REV.buffer=b;RG=AC.createGain();RG.gain.value=.6;REV.connect(RG);RG.connect(AC.destination)}
/* passos abafados: ruído passa-baixa + reverb + um baque grave */
function stepFX(){if(!AC||S.sfx<.01)return;ensureFX();const b=noiseBuf();if(!b)return;const s=AC.createBufferSource(),lp=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;s.playbackRate.value=.8+Math.random()*.2;lp.type='lowpass';lp.frequency.value=TH==2?360:480;lp.Q.value=.7;g.gain.value=S.sfx*.16;s.connect(lp);lp.connect(g);g.connect(AC.destination);g.connect(REV);s.start();s.stop(AC.currentTime+.15);const o=AC.createOscillator(),og=AC.createGain(),n=AC.currentTime;o.frequency.value=TH==2?90:120;og.gain.setValueAtTime(S.sfx*.12,n);og.gain.exponentialRampToValueAtTime(.001,n+.09);o.connect(og);og.connect(AC.destination);o.start(n);o.stop(n+.1)}
/* música de fundo procedural: pads suaves e arpejos com reverb; progressão muda por mundo */
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG={1:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]],2:[[50,53,57],[46,50,53],[48,52,55],[57,61,64]]};
function note(m,t,dur,type,vol,cut){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type=type;o.frequency.value=mtof(m);lp.type='lowpass';lp.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.5,dur*.3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(lp);lp.connect(g);g.connect(dg);g.connect(REV);o.start(t);o.stop(t+dur+.05)}
function musicTick(){if(!AC||!dg)return;const now=AC.currentTime;if(MT<now)MT=now+.05;while(MT<now+.5){const ch=PROG[TH==2?2:1][Math.floor(MI/8)%4];const s=MI%8;if(s==0)ch.forEach(m=>note(m-12,MT,2.4,'sawtooth',.035,700));if(s%2==0&&Math.random()<.6){const m=ch[Math.floor(Math.random()*3)]+(Math.random()<.3?12:0);note(m,MT,1.2,'triangle',.05,2200)}MT+=.3;MI++}}
function startMusic(){if(MTimer)return;MTimer=setInterval(musicTick,150);musicTick()}
/* personagens em pixel art: 16x20 pixels, cada pixel vira um bloco 2x2 */
const PXC={S:'#e8c09a',E:'#1b1020',G:'#2a2a33',M:'#d6d6dd',L:'#1b2236',K:'#0a0f1e'};

const STD=["....HHHHHHHH....","...HHHHHHHHHH...","..HHHHHHHHHHHH..","..HHSSSSSSSSHH..","..HSEESSSSEESH..","..HSSSSSSSSSSH..","..HSSSSSSSSSSH..","...SSSSSSSSSS...","....SSSSSSSS....",".....BBBBBB.....","...BBBBCCBBBB...","..BBBBBCCBBBBB..","..BBBBBCCBBBBB..","..BBBBBBBBBBBB..","..BBBBBBBBBBBB..","...BBBBBBBBBB..."];
const LEGA=["....LLL..LLL....","....LLL..LLL....","....LLL..LLL....","...KKKK..KKKK..."];
const LEGB=["....LLL..LLL....","...LLL....LLL...","...LLL....LLL...","..KKKK....KKKK.."];
function crewPx(c,x,y,L,f,st){const pal={...PXC,B:L.b,C:L.coat?'#e8f4ff':L.b,H:L.h=='helmet'?'#9fd8ff':(L.s=='prof'?'#eaeaf0':(L.hc||'#3a2a1a'))};
const rows=L.s=='prof'?PROF:STD,legs=Math.floor(st/Math.PI)%2?LEGB:LEGA;
c.save();c.translate(Math.round(x),Math.round(y));c.fillStyle='#0007';c.beginPath();c.ellipse(0,1,14,4,0,0,7);c.fill();c.scale(f,1);
const put=(R,oy)=>R.forEach((row,ry)=>{for(let rx=0;rx<row.length;rx++){const ch=row[rx];if(ch=='.')continue;c.fillStyle=pal[ch]||'#f0f';c.fillRect(-16+rx*2,-40+(ry+oy)*2,2,2)}});
put(rows,0);put(legs,16);
if(L.h=='antenna'){c.fillStyle='#cfe8ff';c.fillRect(0,-46,2,6);c.fillStyle='#ff4d4d';c.fillRect(0,-48,2,2)}
if(L.h=='crown'){c.fillStyle='#ffd84a';c.fillRect(-8,-44,16,4);c.fillRect(-8,-48,3,4);c.fillRect(-2,-50,4,6);c.fillRect(5,-48,3,4)}
if(L.h=='halo'){c.fillStyle='#ffd84a';c.fillRect(-10,-48,20,2)}
c.restore()}

function decorate(rooms,n){const out=[];rooms.forEach((r,ri)=>{let s=ri*97+n*13+7;const R=()=>{s=(s*9301+49297)%233280;return s/233280};const[,,x,y,w,h]=r;

for(let i=0;i<3;i++)out.push({k:'lamp',x:x+w*(i+1)/4,y:y+14});
const kinds=n==1?['screen','crate','plant','console']:['orb','wave','node','screen'];const np=3+Math.floor(R()*3);
for(let i=0;i<np;i++){out.push({k:kinds[Math.floor(R()*4)],x:x+30+R()*(w-80),y:y+h*.45+R()*(h*.35),t:R()})}
if(r[0]=='fis'){for(let i=0;i<3;i++)out.push({k:'bench',x:x+30+i*75,y:y+h*.55});out.push({k:'tube',x:x+w-40,y:y+h*.6})}if(r[0]=='aula'){out.push({k:'board',x:x+w/2-60,y:y+30});for(let i=0;i<4;i++)out.push({k:'desk',x:x+30+i*55,y:y+h*.7})}if(r[0]=='bib'){for(let i=0;i<3;i++)out.push({k:'shelf',x:x+20+i*80,y:y+30})}out.push({k:'label',x:x+8,y:y+h-8,txt:r[1]});});return out}

['arch','Vega conduz Kepler ao setor de arquivos. "Orion passou anos pesquisando a natureza da matéria e da energia. Oficialmente, o projeto parou por falta de resultados confiáveis."'],
['arch','Qubit: "Há documentos sobre estrutura atômica, emissão de energia e comportamento da luz." Kepler: "Isso pode explicar o funcionamento do dispositivo."',{qb:1}],
['catbox','Alberto aparece atrás de um vidro, numa sala de observação. Qubit: "Detecto uma assinatura térmica, mas o sistema não consegue determinar sua posição de forma consistente."',{k:1}]]);
fill(W2_SEQ,[['arch','Kepler encontra uma gravação de Orion: "Se alguém estiver assistindo a este registro... não confie nos dados do núcleo." Qubit: "O arquivo foi acessado novamente em 2026."',{rec:1}],
['msg','TRANSMISSÃO DESCONHECIDA: "Você não deveria estar aqui, Kepler. Algumas coisas precisam permanecer no passado."',{l:['"Você não deveria estar aqui, Kepler."','"Algumas coisas precisam','permanecer no passado."','ORIGEM: INDETERMINADA'],sig:'ASSINATURA: NOX',nox:1}],
['cave','As coordenadas apontam para um setor isolado e subterrâneo, onde Orion realizava experimentos sobre o espaço-tempo. Os registros de lá foram deliberadamente apagados.'],
['title','MUNDO 2 — ECOS DO PASSADO. Descubra o que Orion tentava fazer e quem apagou os registros.',{sub:'FASE 2'}]]);
WI[3]=SQ([['obs','FASE 3 — ENTRE DOIS ESTADOS. Uma instalação subterrânea. Numa sala circular, relógios suspensos marcam horários diferentes. Vega: "Nunca estive nesta sala."'],
['obs','No centro há um equipamento semelhante ao de 2026. Qubit: "Semelhança estrutural com o núcleo temporal." Kepler: "Então foi aqui que tudo começou. Alguém tentou manipular o tempo em 2006."',{qb:1}],
['obs','A máquina projeta a verdade: alguém escolheu para onde Kepler seria enviado. Qubit: "A assinatura pertence a um usuário autorizado do Projeto QUANTUM." Kepler: "Nox."',{proj:1}],
['obs','Orion surge: "Tentando impedir que vocês chegassem até aqui. O Projeto Janus foi feito para ligar estados diferentes de um mesmo sistema. Alguém o usou para interferir no que ainda não aconteceu."',{orion:1}],
['obs','Alarme. Nox aparece dentro da anomalia: "Kepler. Você está exatamente onde eu precisava que estivesse." Orion: "Não podemos permitir que ele alcance o setor central!"',{nox:1,orion:1}],
['title','MUNDO 3 — ENTRE DOIS ESTADOS. Relatividade: dilatação do tempo, contração do comprimento e sincronização de relógios.',{sub:'FASE 3'}]]);
WI[4]=SQ([['qua','FASE 4 — O TRAIDOR. Uma realidade instável: objetos mudam de lugar e portas existem em dois lugares ao mesmo tempo. Qubit: "Fenômenos compatíveis com os modelos quânticos dos registros de Orion."'],
['qua','Orion: "O núcleo não responde apenas ao que você faz, mas às condições sob as quais o sistema é observado." O padrão de interferência está inconsistente com a configuração atual.',{slit:1}],
['catbox','Numa sala escura, Alberto está sentado sobre uma caixa. Kepler: "O gato de Schrödinger. É uma referência a superposição de estados." Qubit: "Estado atual: ausência de localização confirmada."',{head:1}],
['msg','PROJETO JANUS: ARQUIVO RESTRITO. Protocolo de continuidade temporal. Última modificação: 2026. Responsável: NOX. O padrão de referência de Kepler estabiliza a conexão.',{h:'ARQUIVO RESTRITO',l:['PROTOCOLO DE CONTINUIDADE','TEMPORAL','Última modificação: 2026','Responsável: NOX'],sig:'KEPLER FOI USADO NO EXPERIMENTO',hc:'#ffd84a'}],
['msg','Nox: "Estou tentando escolher qual realidade deve existir." Orion: "O sistema não suporta esse tipo de interferência!" Kepler: "Ele quer alterar os acontecimentos."',{h:'TRANSMISSÃO · NOX',l:['"O futuro não precisa ser','aceito como inevitável."','"Estou tentando escolher','qual realidade deve existir."'],sig:'NOX',nox:1}],
['door','Alberto aparece diante de uma porta que não estava ali. Ele atravessa. Qubit: "Essa passagem não consta em nenhuma planta da instalação." Kepler: "Então vamos descobrir para onde ela leva."'],
['title','MUNDO 4 — O TRAIDOR. Mecânica Quântica: incerteza, tunelamento, superposição e dupla fenda.',{sub:'FASE 4'}]]);
WI[5]=SQ([['core','FASE 5 — ALÉM DOS LIMITES. O núcleo de convergência liga dois conjuntos de equipamentos: 2006 de um lado, 2026 do outro. Qubit: "A estabilidade diminui rapidamente."'],
['core','Aqui o jogador combina tudo o que aprendeu: parâmetros relativísticos, relógios dos dois períodos, a energia do núcleo e os estados quânticos da conexão.'],
['core','Nox: "Não fiz tudo isso para destruir o projeto. Para escolher entre os resultados." Kepler: "Você confunde possibilidade com controle. A ciência existe para compreender o universo."',{nox:1}],
['portal','Qubit: "Podemos usar a assinatura temporal original para abrir o caminho de volta." Kepler: "Obrigado por tudo, Vega." Vega: "Espero que você encontre o caminho de volta."'],
['title','MUNDO 5 — ALÉM DOS LIMITES. Integração dos conhecimentos.',{sub:'FASE 5'}]]);
fill(ENDING,[['lab','Kepler desperta no laboratório original. Os equipamentos funcionam normalmente. "E Nox?" Qubit: "O registro de acesso do doutor Nox foi apagado do sistema."',{cat:1}],
['catbox','Alberto sobe na bancada e se senta ao lado do computador. Kepler: "Acho que tenho algumas perguntas para você." O gato olha para a câmera.',{head:1}],
['msg','NOVA TRANSMISSÃO DETECTADA. Origem: 2006. "A primeira tentativa foi concluída. A próxima ainda está por vir."',{h:'NOVA TRANSMISSÃO · ORIGEM: 2006',l:['"A primeira tentativa','foi concluída."','"A próxima ainda','está por vir."'],sig:'ASSINATURA: NOX',nox:1}],
['title','QUANTUM — Além dos Limites da Realidade. FIM... POR ENQUANTO.',{sub:'FIM... POR ENQUANTO'}]]);
fill(LAVA_SEQ,[['mech','Piscina de lava: o reator superaquecido derramou seu núcleo líquido nesta sala. A lava não perdoa quem pisa fora das plataformas.',{v:0}],
['mech','As plataformas de pedra flutuam sobre a lava. Use o botão Pulo para saltar de uma a outra. Pular na direção errada leva você para a lava.',{v:1}],

['mech','Terminais de reparo, em verde, curam 1 coração a cada pergunta de física acertada. Eles estão na sala da lava e na sala final.',{v:3}],
['mech','Alerta na sala final: Nox adulterou o protocolo de segurança e ativou os robôs. Eles não reconhecem mais a equipe e patrulham o portão.',{v:4}],
['mech','Os robôs são metálicos e rápidos. Cada golpe corpo a corpo tira 1 coração. Desvie deles e use o botão Atacar com o bastão.',{v:5}],
